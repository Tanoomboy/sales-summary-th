[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-summary-th"
version = "0.1.0"
description = "สรุปยอดขายทั้งวันเป็น 5 บรรทัดภาษาไทย จาก CSV/Excel (ตัวเลขคำนวณด้วยโค้ด ไม่ต้องใช้ AI)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.0"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Natural Language :: Thai",
]

[project.scripts]
sales-summary = "sales_summary_th.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_summary_th = ["data/*.csv"]
